# This file serves as a fast setting input file for Allegro.
# Usually, you can only adjust tags in Important part

# VERY IMPORTANT. Try different setting below
run_name: baseline
batch_size: 1

# Network
l_max: 2
parity: o3_full
# shared allegro part for Eij(r), Jij(r) and Eij(r,s)
num_layers: 2
env_embed_multiplicity: 16
two_body_latent_mlp_latent_dimensions: [32, 64, 128]
latent_mlp_latent_dimensions: [128]

edge_eng_mlp_latent_dimensions: [128, 64]
edge_eng_mlp_nonlinearity: silu

lauto_loss: true
# If turn on auto_loss, suggest to replace all validation_loss with validation_loss_awl
metrics_key: validation_loss_awl

loss_coeffs:
  stress: 1.
  forces: 1.
  total_energy:
    - 1.
    - PerAtomMSELoss
  born_effective_charges: 0.1
  total_born_effective_charges: 1.
born_scale_trainable: false

# IMPORTANT: set it init. No change afterwards usually
# r_max should consider enough spin-spin interaction. At least to second neighbor of spin in usual.
r_max: 5.0
allow_tf32: false # Turn on for A100 but off for V100
root: results/born
append: false
wandb_project: HfO2

# Data
n_train: 4000
n_val: 959
dataset_file_name: ../data/data.extxyz
chemical_symbol_to_type:
  O: 0
  Hf: 1

born_scale_list: [-2., 4.]

# Train
learning_rate: 0.001

lr_scheduler_name: ReduceLROnPlateau
lr_scheduler_patience: 10
lr_scheduler_factor: 0.4

early_stopping_lower_bounds:
  LR: 1.0e-6

early_stopping_patiences:
  validation_loss_awl: 20

# Not so important setting. Keep them as default.
# general
seed: 123456
dataset_seed: 123456
default_dtype: float32

# -- network --
model_builders:
  - allegro.model.Allegro_born
  - PerSpeciesRescale
  - ParaStressForceOutput
  - RescaleEnergyEtc

avg_num_neighbors: auto
BesselBasis_trainable: false
PolynomialCutoff_p: 48

# - start allegro layers -
# number of tensor product layers, 1-3 usually best, more is more accurate but slower
embed_initial_edge: true
two_body_latent_mlp_nonlinearity: silu
two_body_latent_mlp_initialization: uniform
latent_mlp_nonlinearity: silu
latent_mlp_initialization: uniform
latent_resnet: true
env_embed_mlp_latent_dimensions: []
env_embed_mlp_nonlinearity: null
env_embed_mlp_initialization: uniform
edge_eng_mlp_initialization: uniform
# - end allegro layers -

# -- data --
dataset: ase
ase_args:
  format: extxyz
# include_keys:
#   - user_label
key_mapping:
  user_label: label0
# logging
wandb: true
verbose: warning

# training
nosoc_coeff_trainable: false

max_epochs: 10000000
train_val_split: random

shuffle: true

use_ema: true
ema_decay: 0.99
ema_use_num_updates: true

# loss function

# optimizer
optimizer_name: Adam
optimizer_params:
  amsgrad: false #!!!!
  betas: !!python/tuple
    - 0.9
    - 0.999
  eps: 1.0e-08
  weight_decay: 0.

early_stopping_upper_bounds:
  cumulative_wall: 604800.

early_stopping_ladder_upper_bounds:
  cumulative_wall: 604800.

# output metrics
metrics_components:
  - - stress
    - mae
  - - stress
    - rmse
  - - forces # key
    - mae # "rmse" or "mae"
  - - forces
    - rmse
  - - total_energy
    - mae
  - - total_energy
    - rmse
  - - born_effective_charges
    - mae
  - - born_effective_charges
    - rmse
  - - total_born_effective_charges
    - mae
  - - total_born_effective_charges
    - rmse
  - - total_energy
    - mae
    - PerAtom: True # if true, energy is normalized by the number of atoms
  - - total_energy
    - rmse
    - PerAtom: True # if true, energy is normalized by the number of atoms

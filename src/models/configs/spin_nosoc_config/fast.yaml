# This file serves as a fast setting input file for Allegro.
# Usually, you can only adjust tags in Important part
run_name: base
# VERY IMPORTANT. Try different setting below
batch_size: 1

# Network
lhb: true # whether to use isotropic heisenberg model. Always true for magnetic system.
lbiquadratic: false # whether to use biquadratic model.
lnosoc_layer: true # whether to use nosoc layer. True for magnetic system with complex high-order spin interaction.
ldelta_learning: false # whether to use delta learning. True for magnetic datasets with energy_fix_spin.
lpredict_spin_length: false # whether to predict spin length. True for magnetic datasets with spin_length.
node_spin_length_mlp_latent_dimensions: [128, 128, 128, 64] # latent dimensions for spin length mlp
lauto_loss: true

ledge_cutoff: false # Add envelope cutoff to edge energy

l_max: 2 # 1 or 2
# shared allegro part for Eij(r), Jij(r) and Eij(r,s)
env_embed_multiplicity: 16 # 4 or 8 or 16
two_body_latent_mlp_latent_dimensions: [64, 128, 256, 256]
latent_mlp_latent_dimensions: [256, 256, 256]
PolynomialCutoff_p: 48

# allegro_onlyr part for Eij(r) and Jij(r)
# allegro_nosoc for Eij(r,s). Default: shared part
allegro_onlyr_num_layers: 1 # 1 or 2
allegro_nosoc_num_layers: 1

edge_onlyr_eng_mlp_latent_dimensions: [128, 128, 128, 64] # final layer for onlyr net
edge_hb_coeff_mlp_latent_dimensions: [128, 128, 128, 64] # final layer for hb net
edge_eng_nosoc_mlp_latent_dimensions: [128] # final layer for nosoc net

# E = edge_onlyr_eng_coeff * Eij(r) + edge_hb_eng_coeff * Jij(r)*si*sj + edge_eng_nosoc_coeff * Eij(r,s)
ene_coeff_trainable: false # whether to train these three ene_coeff. Usually helps.
edge_onlyr_eng_coeff: 1.0
edge_hb_eng_coeff: 0.05
edge_eng_nosoc_coeff: 0.05

# For magnetic system, total_energy is usually important and need larger coefficient.
loss_coeffs:
  stress: 1.0
  forces: 1.0
  total_energy:
    - 10.
    - PerAtomMSELoss

# IMPORTANT: set it init. No change afterwards usually
# r_max should consider enough spin-spin interaction. At least to second neighbor of spin in usual.
r_max: 6.0 # suggest 5.0 ~ 7.0
allow_tf32: false # Turn on for A100 but off for V100
root: results/spin_nosoc
wandb_project: spin_nosoc

# Data 4857, left 300 for test
n_train: 4200
n_val: 357
dataset_file_name: data.extxyz
chemical_symbol_to_type:
  Bi: 0
  Fe: 1
  O: 2

# Train
learning_rate: 0.001

lr_scheduler_name: ReduceLROnPlateau
lr_scheduler_patience: 15
lr_scheduler_factor: 0.5

early_stopping_lower_bounds:
  LR: 1.0e-5

early_stopping_patiences:
  validation_loss_awl: 30

# If turn on auto_loss, suggest to replace all validation_loss with validation_loss_awl
metrics_key: validation_loss_awl

parity: o3_full # o3_full or o3_restricted or so3

# train_spin_ladder part. Usually no need.
train_spin_ladder: false
learning_rate_fine_tune: 0.0005 # Used for fine-tune state 2 and 4
lr_scheduler_ladder_name: ReduceLROnPlateau
lr_scheduler_ladder_patience: 4
lr_scheduler_ladder_factor: 0.2
early_stopping_ladder_lower_bounds:
  LR: 1.0e-5
early_stopping_ladder_patiences:
  validation_loss_awl: 10
# End train_spin_ladder part

# Not so important setting. Keep them as default.
# general
append: false
dataloader_num_workers: 4
seed: 123456
dataset_seed: 123456
default_dtype: float32

# -- network --

model_builders:
  - allegro.model.Allegro_nosoc
  - PerSpeciesRescale
  - ParaStressForceSpinOutput
  - RescaleEnergyEtc

avg_num_neighbors: auto
BesselBasis_num_basis: 8
BesselBasis_trainable: false

# - start allegro layers -
embed_initial_edge: true
two_body_latent_mlp_nonlinearity: silu
two_body_latent_mlp_initialization: uniform
latent_mlp_nonlinearity: silu
latent_mlp_initialization: uniform
latent_resnet: true
env_embed_mlp_latent_dimensions: []
env_embed_mlp_nonlinearity: null
env_embed_mlp_initialization: uniform
# - end allegro layers -

edge_onlyr_eng_mlp_nonlinearity: silu
edge_onlyr_eng_mlp_initialization: uniform

edge_hb_coeff_mlp_nonlinearity: silu
edge_hb_coeff_mlp_initialization: uniform

edge_eng_nosoc_mlp_nonlinearity: null
edge_eng_nosoc_initialization: uniform

# -- data --
dataset: ase
ase_args:
  format: extxyz

# logging
wandb: false
verbose: info

max_epochs: 10000000
train_val_split: random

shuffle: true

use_ema: true
ema_decay: 0.99
ema_use_num_updates: true

# loss function

# optimizer
optimizer_name: Adam
optimizer_amsgrad: true
optimizer_params:
  amsgrad: true #!!!!
  betas: !!python/tuple
    - 0.9
    - 0.999
  eps: 1.0e-08
  weight_decay: 0.

early_stopping_upper_bounds:
  cumulative_wall: 604800.

early_stopping_ladder_upper_bounds:
  cumulative_wall: 604800.

# output metrics
metrics_components:
  - - stress
    - mae
  - - stress
    - rmse
  - - forces # key
    - mae # "rmse" or "mae"
  - - forces
    - rmse
  - - total_energy
    - mae
    - PerAtom: True # if true, energy is normalized by the number of atoms
  - - total_energy
    - rmse
    - PerAtom: True # if true, energy is normalized by the number of atoms

[pytest]
# Repo-level pytest configuration (single source for src/core, src/models,
# tests_native, tests_v2, and tests_ci). Suites are invoked with explicit
# paths; this file only provides shared markers and collection guards.
addopts = -ra --strict-markers
xfail_strict = true
markers =
    gpu: requires a CUDA device
    lammps: requires a modern SpinGNN2 LAMMPS binary (lmp_spingnn2)
    lammps_contract: environment probe that must not satisfy an inference lane
    mpi: requires an MPI LAMMPS binary and mpirun
    slow: long-running test (>60s); explicit end-to-end lane or weekly/manual lane
    compile: optimization parity gate; enabled via SPINGNN_TEST_COMPILE=1
    bf16: bf16 autocast measurement; informational only, not a release gate (see docs)
    inference_perf: LAMMPS inference performance instrumentation and gate contracts
norecursedirs = .* build dist *.egg-info __pycache__ docker docs example benchmark_data validation
